<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Mynt Helpdesk — staff ticketing console">
  <meta name="theme-color" content="#0037B7">

  <!-- iOS / standalone PWA meta -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mynt Helpdesk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Mynt Helpdesk</title>

  <style>
    html, body { margin: 0; padding: 0; background: #F5F7FB; }
    #initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F5F7FB;
      z-index: 2147483647;
      transition: opacity 200ms ease;
    }
    #initial-loader.is-hidden { opacity: 0; pointer-events: none; }
    #initial-loader .spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid #E3EDFA;
      border-top-color: #0037B7;
      animation: initial-loader-spin 0.8s linear infinite;
    }
    @keyframes initial-loader-spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      html, body, #initial-loader { background: #0E0E10; }
      #initial-loader .spinner { border-color: #1D242F; border-top-color: #0037B7; }
    }
  </style>
</head>
<body>
  <div id="initial-loader" aria-label="Loading"><div class="spinner"></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('initial-loader');
      if (!el) return;
      el.classList.add('is-hidden');
      setTimeout(function () { el.remove(); }, 220);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
